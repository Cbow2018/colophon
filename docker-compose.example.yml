services:
  colophon:
    image: ghcr.io/cbow2018/colophon:v1.0.0   # pin a version, not :latest
    container_name: colophon
    restart: unless-stopped

    # PUID:PGID. Use the same user your library app runs as, so it can read
    # the books Colophon puts in the output folder.
    user: "1000:1000"

    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    # No ports. Colophon never listens for anything.

    volumes:
      - ./config:/config:ro
      - /srv/books/ingest:/ingest
      - /srv/books/output:/output
      - /srv/books/backups:/backups

    # The API keys. Create ./secrets/hardcover_token and
    # ./secrets/google_books_key (one line each, the key) and leave them
    # readable only by you; they are mounted at /run/secrets/, where the config
    # expects them. Secrets never go in the environment or the image.
    #
    # A key that is not there is not fatal: Colophon says so once at startup and
    # carries on with the sources it can use.
    secrets:
      - hardcover_token
      - google_books_key

    environment:
      # Overrides config.toml. Remove this once you trust the log.
      - COLOPHON_DRY_RUN=true

secrets:
  hardcover_token:
    file: ./secrets/hardcover_token
  google_books_key:
    file: ./secrets/google_books_key
