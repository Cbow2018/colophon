services:
  colophon:
    image: ghcr.io/cbow2018/colophon:v1.0.0   # pin a version, not :latest
    container_name: colophon
    restart: unless-stopped

    # PUID:PGID. Use the same user your library app runs as, so it can read
    # the books Colophon puts in the output folder.
    user: "1000:1000"

    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    # No ports. Colophon never listens for anything.

    volumes:
      - ./config:/config:ro
      - /srv/books/ingest:/ingest
      - /srv/books/output:/output
      - /srv/books/backups:/backups

    # The Hardcover API token. Create ./secrets/hardcover_token (one line, the
    # token) and leave it readable only by you; it is mounted at
    # /run/secrets/hardcover_token, where the config expects it. Secrets never
    # go in the environment or the image.
    secrets:
      - hardcover_token

    environment:
      # Overrides config.toml. Remove this once you trust the log.
      - COLOPHON_DRY_RUN=true

secrets:
  hardcover_token:
    file: ./secrets/hardcover_token
