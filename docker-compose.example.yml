services:
  colophon:
    image: ghcr.io/cbow2018/colophon:v1.0.0   # pin a version, not :latest
    container_name: colophon
    restart: unless-stopped

    # PUID:PGID. Use the same user your library app runs as, so it can read
    # the books Colophon puts in the output folder.
    user: "1000:1000"

    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    # No ports. Colophon never listens for anything.

    volumes:
      - ./config:/config:ro
      - /srv/books/ingest:/ingest
      - /srv/books/output:/output
      - /srv/books/backups:/backups

    # The API keys. Create ./secrets/hardcover_token (one line, the token) and
    # leave it readable only by you; it is mounted at /run/secrets/, where the
    # config expects it. Secrets never go in the environment or the image.
    #
    # Colophon tolerates a missing key - it says so once at startup and carries
    # on with the sources it can use - but a `file:` secret still has to exist
    # for Compose to start the stack, so the keys you do not have are left out.
    # Create ./secrets/google_books_key, then uncomment the google_books_key
    # line below and the block at the bottom of this file.
    #
    # The LLM key is the same: optional, and uncertain books are marked
    # unverified rather than held while it is missing. Create
    # ./secrets/llm_key, then uncomment llm_key.
    secrets:
      - hardcover_token
      # - google_books_key
      # - llm_key

    environment:
      # Overrides config.toml. Remove this once you trust the log.
      - COLOPHON_DRY_RUN=true

secrets:
  hardcover_token:
    file: ./secrets/hardcover_token
  # Uncomment once you have created ./secrets/google_books_key.
  # google_books_key:
  #   file: ./secrets/google_books_key
  # Uncomment once you have created ./secrets/llm_key.
  # llm_key:
  #   file: ./secrets/llm_key
