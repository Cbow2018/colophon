# Colophon settings. Copy this to config/config.toml and edit it.
#
# Every setting here can also be given as an environment variable: the name in
# capitals with COLOPHON_ in front, e.g. COLOPHON_DRY_RUN=false. The
# environment wins over this file. Secrets never go in either: API keys are read
# from files, and the settings below are paths to those files, not the keys.

# Watched for new books. Anything dropped here is moved to output_dir.
ingest_dir = "/ingest"

# Where your library app (CWA, Grimmory, ...) imports from.
output_dir = "/output"

# Kept copies of originals. A book's original is put here before its metadata
# is changed, and an identical duplicate the library already has is moved here
# rather than deleted. Nothing here is ever overwritten.
backup_dir = "/backups"

# How long those kept copies last, in days. Anything older is deleted on the
# next scan. This covers duplicates filed here by the relay too.
backup_retention_days = 30

# Which sources to look a book up in, in this order. The first source that has
# the book is the one its values are taken from, so put the one you trust most
# first. Leave a name out to disable that source; a list with one name is fine.
#
# "hardcover" needs hardcover_token_file below.
# "google_books" needs google_books_key_file below - Google gives a keyless
# caller no lookups at all, so without a key that source is skipped entirely.
#
# Two things worth knowing when you order this list:
#   * Google Books has no series data. A book matched from it gets its title and
#     authors corrected and no series written, whatever the file had.
#   * If a source you have listed cannot be reached, Colophon stops there for
#     that book rather than asking a lower-priority source. A book is never
#     quietly corrected from a source you ranked below a working one.
sources = ["hardcover", "google_books"]

# Where the Docker secret holding your Hardcover API token is mounted. This is
# a path, never the token itself. If the file is not there, Colophon says so at
# startup and passes books through with their metadata as it is.
hardcover_token_file = "/run/secrets/hardcover_token"

# The same for your Google Books API key. Also a path, never the key itself.
# Create one in the Google Cloud console with the Books API enabled.
google_books_key_file = "/run/secrets/google_books_key"

# The LLM fallback chooser. When the rules cannot decide between the candidates
# a source offered, an OpenAI-compatible endpoint can be asked which of them is
# the same book - or that none is. It only ever chooses: every value written
# still comes from the chosen candidate's own record, and a pick its own
# reported confidence is not sure of is not applied.
#
# Leave the key file out and a preset that needs one is simply not used:
# uncertain books take the unverified path exactly as they did before. That is
# the default, because no key file exists until you make one.
#
# Anything OpenAI-compatible works. `llm_provider` names a preset that fills in
# the base URL and a suggested model, and both can be overridden below:
#
#   deepseek (default)  https://api.deepseek.com
#   anthropic           https://api.anthropic.com/v1/
#   gemini              https://generativelanguage.googleapis.com/v1beta/openai/
#   openai              https://api.openai.com/v1
#   openrouter          https://openrouter.ai/api/v1
#   groq                https://api.groq.com/openai/v1
#   ollama              http://localhost:11434/v1/   (no key needed)
#
# Any other name is a custom endpoint: set llm_base_url and llm_model to say
# where it is and what to ask for. Its key is optional, so a local server that
# wants none works with no key file at all. Only DeepSeek has been tested with
# Colophon; the rest are their providers' documented endpoints and models.
#
# llm_provider = "deepseek"
# llm_base_url = ""            # empty means the preset's own
# llm_model = ""               # empty means the preset's suggestion

# Where the Docker secret holding your LLM API key is mounted. A path, never
# the key itself, and one file for every provider: switching provider should
# mean changing these settings, not renaming the secret. Ollama ignores it, and
# so does any custom endpoint that needs no key - the file simply not being
# there is how you say so.
# llm_key_file = "/run/secrets/llm_key"

# How many calls a UTC day may spend, whether or not they succeed. 0 means no
# limit. The count is kept in a hidden file in the backups folder, which is the
# one place Colophon is already sure it can write and whose cleanup leaves
# hidden files alone. A book that could not be asked - the limit is spent, the
# endpoint is down, the key was refused - waits in the ingest folder untouched
# until the next UTC day, and is asked again then.
# llm_daily_limit = 200

# On by default, so a fresh install cannot surprise you: Colophon logs what it
# would do and moves nothing. Set this to false once the log looks right.
dry_run = true

# How often to look in the ingest folder, in seconds.
poll_seconds = 5

# How many checks in a row a file must be unchanged before it counts as
# finished copying. With the default poll_seconds, 2 means about 5 seconds of
# quiet. Raise it if books arrive over a slow or flaky network share.
stable_checks = 2

# Name endings that mean a download is still running. These are left alone.
# Files whose names begin with a dot are always skipped.
skip_suffixes = [".part", ".tmp", ".!qb", ".crdownload"]

# DEBUG, INFO, WARNING or ERROR.
log_level = "INFO"

# How sure a title-and-author match has to be before Colophon writes it, as a
# number above 0 and at most 1. A candidate's confidence is how well its title
# and its author agree with what the file says. 0.85 is the design's default.
#
# A book nothing matches that confidently is not corrected at all: it keeps the
# metadata it came with and is marked instead - tagged `colophon:unverified`,
# with "Metadata could not be verified by Colophon." at the end of its
# description - so you can find it in your library without reading logs. Drop a
# marked book in again once a source has it and the mark comes off.
#
# 1.0 accepts a title and an author that both agree exactly, and marks
# everything else unverified instead of writing it - a record whose title merely
# contains the file's, one that kept a subtitle the file dropped, one at a
# different place in the series - however good it looks.
#
# One exact match is still marked, and it is worth knowing about: a file whose
# title carries a series position, matched to a record carrying a different one,
# scores 0.9 rather than 1.0. Either side saying nothing about the position
# scores 1.0, as does agreement, so most files - which carry no position in the
# title - are unaffected by this.
#
# It is not a way to say "use the ISBN and ignore titles". A title and an author
# that agree exactly still clear 1.0, so books are still corrected by title under
# this setting - just nothing less certain than that. The line below is the
# default; uncomment and change it to overrule that. It is written before the
# [fields] table on purpose: in TOML everything after a table header belongs to
# that table.
#
# Anything above 1.0 is refused rather than treated as "match nothing": no
# candidate can score above 1.0, so it is a typo, not an intention.
# confidence = 0.85

# Add a cover to a book that has none, from the source that matched it. A book
# that arrived with a cover keeps it: this setting only ever adds one. Only the
# source that matched is asked, so a book matched from a source with no cover
# for it is left without one rather than reaching down the priority list.
#
# The line below is commented out because `true` is already what Colophon does.
# Uncomment it - and change it - only to overrule that. It is written before the
# [fields] table on purpose: in TOML everything after a table header belongs to
# that table.
# add_cover = true

# What to do with each metadata field when a source has the book. One rule each:
#
#   "overwrite" - write the source's value, whatever the file already says
#   "fill"      - write it only when the file has nothing for that field
#   "skip"      - never write it; the file keeps what it came with
#
# A field written here takes that rule; a field left out keeps the default, and
# every one of these is its default, so nothing needs uncommenting to get the
# behaviour described. Uncomment the ones you want to change.
#
# Every value written comes from the matched source's own record. Nothing here
# is generated, and a field the source does not have is never written at all -
# "fill" on a field a source is silent about is not a blank.
#
# The description is the book's blurb, taken from the matched source. Colophon
# never writes one of its own.
#
# The defaults, as the design settled them:
#
# [fields]
# title = "overwrite"
# authors = "overwrite"
# series = "overwrite"
# series_number = "overwrite"
# description = "fill"
# publisher = "fill"
# date = "fill"
# isbn = "fill"
# language = "fill"
#
# A series number is a position in a named series, so it always follows its
# series: the source's number is written only when the series the book ends up
# in is the source's own. Otherwise the file's own number stays, unless a series
# was written in place of the one around it, and then it is dropped.

